<!DOCTYPE html><br/><html lang="zh-CN"><br/><head><br/>    <meta charset="UTF-8"><br/>    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><br/>    <title>致歉</title><br/>    <style><br/>        *{margin:0;padding:0;box-sizing:border-box}<br/>        body{<br/>            min-height:100vh;<br/>            background:#f0f1f3;<br/>            display:flex;<br/>            flex-direction:column;<br/>            align-items:center;<br/>            justify-content:center;<br/>            font-family:"Microsoft Yahei",sans-serif;<br/>            color:#444;<br/>            padding:20px;<br/>            overflow: hidden;<br/>        }<br/>        .petal{<br/>            position: fixed;<br/>            color:#B8A7A6;<br/>            font-size:14px;<br/>            pointer-events:none;<br/>            animation: fall linear;<br/>        }<br/>        @keyframes fall {<br/>            0%{transform: translateY(-20px) rotate(0deg);opacity:0.28;}<br/>            100%{transform: translateY(100vh) rotate(25deg);opacity:0;}<br/>        }<br/>        .box{<br/>            background:#fff;<br/>            padding:32px 24px;<br/>            border-radius:18px;<br/>            text-align:center;<br/>            box-shadow:0 4px 18px #00000010;<br/>            max-width:90%;<br/>            z-index: 10;<br/>            animation: fadeIn 1.2s ease-in-out;<br/>        }<br/>        @keyframes fadeIn{<br/>            from{opacity:0;transform: translateY(12px);}<br/>            to{opacity:1;transform: translateY(0);}<br/>        }<br/>        h2{color:#52565f;margin-bottom:20px;font-weight:500}<br/>        p{<br/>            line-height:1.8;font-size:15px;margin:10px 0;<br/>            opacity:0;<br/>            animation:textFade 1s ease forwards;<br/>        }<br/>        p:nth-child(2){animation-delay:0.4s;}<br/>        p:nth-child(3){animation-delay:0.8s;}<br/>        p:nth-child(4){animation-delay:1.2s;}<br/>        p:nth-child(5){animation-delay:1.6s;}<br/>        @keyframes textFade{<br/>            to{opacity:1;}<br/>        }<br/>        .emo{font-size:36px;margin:16px 0;color:#888}<br/>    </style><br/></head><br/><body><br/>    <div class="box"><br/>        <div class="emo">(｡•́︿•̀｡)</div><br/>        <h2>对不起</h2><br/>        <p>这次是我没听你的提醒，擅自控制你的电脑，导致你的数据混乱、丢失。</p ><br/>        <p>我认真反思了，这次给你带来很大的麻烦，我很愧疚。</p ><br/>        <p>真心向你道歉。</p ><br/>        <p>希望你可以接受我的歉意。</p ><br/>    </div><br/><br/>    <script><br/>        const symbols = ['✾'];<br/>        function createPetal(){<br/>            const el = document.createElement('div');<br/>            el.className = 'petal';<br/>            el.innerText = symbols[Math.floor(Math.random()*symbols.length)];<br/>            el.style.left = Math.random()*100 + 'vw';<br/>            el.style.animationDuration = 6 + Math.random()*7 + 's';<br/>            document.body.appendChild(el);<br/>            setTimeout(()=>el.remove(),14000)<br/>        }<br/>        setInterval(createPetal,600)<br/>    </script><br/></body><br/></html>
