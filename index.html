<!DOCTYPE html><br/><html lang="zh-CN"><br/><head><br/><meta charset="UTF-8"><br/><title>对不起</title><br/><style><br/>*{margin:0;padding:0}<br/>body{<br/>  min-height:100vh;<br/>  background:#fff;<br/>  font-size:20px;<br/>  color:#333;<br/>  padding:60px 40px;<br/>  box-sizing:border-box;<br/>}<br/>h1{margin:20px 0 30px}<br/>p{margin:22px 0;line-height:1.8}<br/>/* 花瓣 */<br/>.petal{<br/>  position:fixed;<br/>  z-index:-1;<br/>  width:16px;height:16px;<br/>  background:#ffc0cb;<br/>  border-radius:50% 0 50% 50%;<br/>  opacity:0.7;<br/>  animation:fall linear infinite;<br/>}<br/>@keyframes fall{<br/>  0%{transform:translateY(-20px) rotate(0deg);opacity:0.8}<br/>  100%{transform:translateY(100vh) rotate(720deg);opacity:0}<br/>}<br/></style><br/></head><br/><body><br/><p>(｡•́︿•̀｡)</p ><br/><h1>对不起</h1><br/><p>这次是我没听你的提醒，擅自控制你的电脑，导致你的数据混乱、丢失。</p ><br/><p>我认真反思了，这次给你带来很大的麻烦，我很愧疚。</p ><br/><p>真心向你道歉。</p ><br/><p>希望你可以接受我的歉意。</p ><br/><br/><script><br/>//生成花瓣<br/>function createPetal(){<br/>  const p = document.createElement("div");<br/>  p.className="petal";<br/>  p.style.left = Math.random()*100 + "vw";<br/>  p.style.animationDuration = (4+Math.random()*5)+"s";<br/>  document.body.appendChild(p);<br/>  setTimeout(()=>p.remove(),9000);<br/>}<br/>setInterval(createPetal,250);<br/></script><br/></body><br/></html>
